# WASLAH - whole system on one machine.
# Run from the repo root (services/.env holds the values; never commit it):
#   docker compose --env-file services/.env -f infrastructure/docker/compose.yaml up -d --build
# Optional:  --profile tools  (Kafka UI on 8085)   --profile scale  (second Workspace on 8093)
# Containers talk over the Docker network by service name, never localhost.
name: waslah

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Addresses inside the Docker network; they override the localhost values from services/.env.
x-service-env: &service-env
  DB_URL: jdbc:postgresql://postgres:5432/waslah
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  IDENTITY_URL: http://identity-service:8081
  CAREER_URL: http://career-service:8082
  WORKSPACE_URL: http://workspace-service:8083
  NOTIFICATION_URL: http://notification-service:8084
  APP_BASE_URL: http://localhost
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70

services:
  postgres:
    image: postgres:18
    container_name: waslah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: waslah
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in services/.env}
    ports:
      - "5433:5432"   # 5433 on your machine, because 5432 is already used by another project
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, on an empty volume: 01-schema.sql, 02-seed.sql, 03-processed-events.sql
      - ../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d waslah"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  kafka:
    image: apache/kafka:3.9.1
    container_name: waslah-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    # No volume on purpose: events survive restarts of the container, and `down` starts Kafka empty.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    logging: *default-logging

  kafka-ui:
    profiles: ["tools"]
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: waslah-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: waslah
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  identity-service:
    build: ../../services/identity_service
    image: waslah/identity-service:local
    container_name: waslah-identity-service
    restart: unless-stopped
    env_file: ../../services/.env
    environment:
      <<: *service-env
      PORT: "8081"
      PROFILE_IMAGES_DIR: /app/uploads/profile-images
    ports:
      - "8081:8081"
    volumes:
      - profile-images:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *default-logging

  career-service:
    build: ../../services/career_service
    image: waslah/career-service:local
    container_name: waslah-career-service
    restart: unless-stopped
    env_file: ../../services/.env
    environment:
      <<: *service-env
      PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *default-logging

  workspace-service:
    build: ../../services/workspace_service
    image: waslah/workspace-service:local
    container_name: waslah-workspace-service
    restart: unless-stopped
    env_file: ../../services/.env
    environment:
      <<: *service-env
      PORT: "8083"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *default-logging

  notification-service:
    build: ../../services/notification_service
    image: waslah/notification-service:local
    container_name: waslah-notification-service
    restart: unless-stopped
    env_file: ../../services/.env
    environment:
      <<: *service-env
      PORT: "8084"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *default-logging

  workspace-service-2:
    profiles: ["scale"]
    build: ../../services/workspace_service
    image: waslah/workspace-service:local
    container_name: waslah-workspace-service-2
    restart: unless-stopped
    env_file: ../../services/.env
    environment:
      <<: *service-env
      PORT: "8093"
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8093/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *default-logging

  frontend:
    build: ../../frontend
    image: waslah/frontend:local
    container_name: waslah-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - identity-service
      - career-service
      - workspace-service
      - notification-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  pgdata:
  profile-images:
