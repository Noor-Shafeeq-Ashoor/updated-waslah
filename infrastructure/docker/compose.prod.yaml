
name: waslah

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-env: &service-env
  DB_URL: ${DB_URL:?DB_URL is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  IDENTITY_URL: http://identity-service:8081
  CAREER_URL: http://career-service:8082
  WORKSPACE_URL: http://workspace-service:8083
  NOTIFICATION_URL: http://notification-service:8084
  APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
  DDL_AUTO: validate
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    logging: *default-logging

  identity-service:
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/waslah/identity-service:${DEPLOY_VERSION:?DEPLOY_VERSION is required}
    restart: unless-stopped
    environment:
      <<: *service-env
      PORT: "8081"
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      PROFILE_IMAGES_DIR: /app/uploads/profile-images
    volumes:
      - profile-images:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *default-logging

  career-service:
    image: ${ECR_REGISTRY}/waslah/career-service:${DEPLOY_VERSION}
    restart: unless-stopped
    environment:
      <<: *service-env
      PORT: "8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *default-logging

  workspace-service:
    image: ${ECR_REGISTRY}/waslah/workspace-service:${DEPLOY_VERSION}
    restart: unless-stopped
    environment:
      <<: *service-env
      PORT: "8083"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *default-logging

  notification-service:
    image: ${ECR_REGISTRY}/waslah/notification-service:${DEPLOY_VERSION}
    restart: unless-stopped
    environment:
      <<: *service-env
      PORT: "8084"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *default-logging

  frontend:
    image: ${ECR_REGISTRY}/waslah/frontend:${DEPLOY_VERSION}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - identity-service
      - career-service
      - workspace-service
      - notification-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  kafka-data:
  profile-images:
