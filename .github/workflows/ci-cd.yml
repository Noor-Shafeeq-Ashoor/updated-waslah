
# WASLAH CI/CD
#
# Push / Pull Request:
#   Test Java services -> Build frontend -> Build Docker images
#
# Push to default branch:
#   Push images to ECR -> Upload deployment files to S3 -> Deploy to EC2
#
# Manual workflow with version:
#   Skip builds and deploy existing ECR images (for example 1.0.5)
#
# Production deployment uses GitHub OIDC, AWS S3, SSM and Docker Compose.

name: CI/CD

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      version:
        description: "Existing image version to deploy. Leave empty to build a new version."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:

  # ============================================================
  # 1. Build and test Java microservices
  # ============================================================

  test:
    name: Build & test (${{ matrix.service }})
    if: ${{ !inputs.version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - identity_service
          - career_service
          - workspace_service
          - notification_service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Compile, test and package
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B -ntp -f services/${{ matrix.service }}/pom.xml verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  # ============================================================
  # 2. Build React frontend
  # ============================================================

  frontend:
    name: Build frontend
    if: ${{ !inputs.version }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # ============================================================
  # 3. Build Docker images and push to Amazon ECR
  # ============================================================

  images:
    name: Image (${{ matrix.name }})
    needs: [test, frontend]

    if: ${{ !inputs.version }}
    runs-on: ubuntu-latest

    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.AWS_ROLE_ARN != '' }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: identity-service
            context: services/identity_service

          - name: career-service
            context: services/career_service

          - name: workspace-service
            context: services/workspace_service

          - name: notification-service
            context: services/notification_service

          - name: frontend
            context: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.PUSH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.ecr.outputs.registry || 'local' }}/waslah/${{ matrix.name }}:${{ env.VERSION }}
            ${{ steps.ecr.outputs.registry || 'local' }}/waslah/${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ============================================================
  # 4. Deploy WASLAH to AWS
  # ============================================================

  deploy:
    name: Deploy to AWS
    needs: [images]

    if: >-
      ${{
        always()
        && !cancelled()
        && github.ref_name == github.event.repository.default_branch
        && github.event_name != 'pull_request'
        && vars.AWS_ROLE_ARN != ''
        && vars.AWS_REGION != ''
        && vars.EC2_INSTANCE_ID != ''
        && vars.DEPLOY_BUCKET != ''
        && (
          (github.event_name == 'workflow_dispatch' && inputs.version != '')
          || needs.images.result == 'success'
        )
      }}

    runs-on: ubuntu-latest
    environment: production

    steps:
      # --------------------------------------------------------
      # 4.1 Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 4.2 Authenticate to AWS using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # --------------------------------------------------------
      # 4.3 Upload deployment files to S3
      # --------------------------------------------------------

      - name: Upload production release files to S3
        env:
          DEPLOY_VERSION: ${{ inputs.version || env.VERSION }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: |
          set -euo pipefail

          : "${DEPLOY_BUCKET:?DEPLOY_BUCKET is required}"

          RELEASE_PATH="s3://${DEPLOY_BUCKET}/releases/${DEPLOY_VERSION}"

          echo "Uploading WASLAH deployment files..."

          aws s3 cp \
            infrastructure/docker/compose.prod.yaml \
            "${RELEASE_PATH}/compose.prod.yaml"

          aws s3 cp \
            infrastructure/db/01-schema.pg17.sql \
            "${RELEASE_PATH}/01-schema.pg17.sql"

          aws s3 cp \
            infrastructure/aws/scripts/deploy.sh \
            "${RELEASE_PATH}/deploy.sh"

          echo "Release files uploaded successfully."

      # --------------------------------------------------------
      # 4.4 Deploy to EC2 using AWS Systems Manager
      # --------------------------------------------------------

      - name: Deploy WASLAH to EC2 using SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_VERSION: ${{ inputs.version || env.VERSION }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: |
          set -euo pipefail

          echo "Deploying WASLAH version ${DEPLOY_VERSION}"
          echo "Target EC2: ${INSTANCE_ID}"

          # Build SSM commands safely using jq.
          COMMANDS=$(jq -nc \
            --arg bucket "$DEPLOY_BUCKET" \
            --arg version "$DEPLOY_VERSION" \
            '{
              commands: [
                "set -e",
                "mkdir -p /opt/waslah/scripts",
                "chown -R ec2-user:ec2-user /opt/waslah",
                (
                  "aws s3 cp s3://" +
                  $bucket +
                  "/releases/" +
                  $version +
                  "/deploy.sh /opt/waslah/scripts/deploy.sh"
                ),
                "chown ec2-user:ec2-user /opt/waslah/scripts/deploy.sh",
                "chmod 700 /opt/waslah/scripts/deploy.sh",
                (
                  "sudo -iu ec2-user /opt/waslah/scripts/deploy.sh " +
                  $version
                )
              ]
            }')

          # Send the command to EC2.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "WASLAH deploy ${DEPLOY_VERSION}" \
            --parameters "$COMMANDS" \
            --query Command.CommandId \
            --output text)

          echo "SSM Command ID: ${CMD_ID}"

          # Wait for deployment to finish (maximum 15 minutes).
          STATUS="Pending"

          for i in $(seq 1 90); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)

            case "$STATUS" in
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              *)
                break
                ;;
            esac
          done

          # Display deployment output.
          echo "========== Deployment Output =========="

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent \
            --output text

          echo "Deployment status: ${STATUS}"

          # Fail the workflow if EC2 deployment failed.
          if [ "$STATUS" != "Success" ]; then

            echo "========== Deployment Errors =========="

            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent \
              --output text

            exit 1
          fi

          echo "WASLAH ${DEPLOY_VERSION} deployed successfully."

      # --------------------------------------------------------
      # 4.5 Deployment summary
      # --------------------------------------------------------

      - name: Deployment summary
        if: always()
        env:
          DEPLOY_VERSION: ${{ inputs.version || env.VERSION }}
        run: |
          echo "### WASLAH Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${DEPLOY_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
