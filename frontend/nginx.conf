# Single entry point: serves the React app and forwards each API path to its service.
# This is a reverse proxy (routing only), not an API Gateway.
server {
    listen 80;
    client_max_body_size 6m;   # profile images up to 5 MB

    # Docker's DNS; names are looked up per request, so Nginx starts even if a service is still starting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $identity     http://identity-service:8081;
    set $career       http://career-service:8082;
    set $workspace    http://workspace-service:8083;
    set $notification http://notification-service:8084;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- identity-service ----
    location /auth {
        proxy_pass $identity;
    }

    location /api/users {
        proxy_pass $identity;
    }

    location /api/profile {
        proxy_pass $identity;
    }

    location /api/admin {
        proxy_pass $identity;
    }

    location /api/employer-requests {
        proxy_pass $identity;
    }

    # ---- career-service ----
    location /api/jobs {
        proxy_pass $career;
    }

    location /api/applications {
        proxy_pass $career;
    }

    # ---- workspace-service ----
    location /api/cafes {
        proxy_pass $workspace;
    }

    location /api/study-spaces {
        proxy_pass $workspace;
    }

    location /api/bookings {
        proxy_pass $workspace;
    }

    location /api/study-sessions {
        proxy_pass $workspace;
    }

    location /api/manager {
        proxy_pass $workspace;
    }

    location /api/cafe-requests {
        proxy_pass $workspace;
    }

    # ---- notification-service ----
    location /api/notifications {
        proxy_pass $notification;
        # Server-Sent Events: no buffering, long-lived connection.
        # (A proxy_set_header here replaces the server-level ones, so they are repeated.)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 1h;
    }

    # Internal service-to-service API is never exposed to the browser
    location /api/internal/ {
        return 404;
    }

    # React app: unknown paths fall back to index.html (client-side routing)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
