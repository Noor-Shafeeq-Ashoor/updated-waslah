
spring.application.name=waslah
server.port=8080

# Default profile
spring.profiles.default=dev

# JPA
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}

# Profile image upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Directory used to store uploaded profile images
app.upload.profile-images-dir=uploads/profile-images


# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Public address of this API (used for links in emails)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Admin account seeded on startup (only when ADMIN_PASSWORD is set)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@waslah.com}
app.admin.password=${ADMIN_PASSWORD:}