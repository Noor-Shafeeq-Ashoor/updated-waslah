# Development profile: local PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/waslah
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.com.ga.waslah=DEBUG

# Admin account
app.admin.username=admin
app.admin.email=admin@waslah.com
app.admin.password=Admin@12345

# Demo user accounts
app.seed.demo-user-password=Student@12345

# Cafe manager account
app.seed.cafe-manager-password=Cafe@12345

# Enable only when preparing fresh concurrency test data.
app.seed.concurrency-tests=${WASLAH_SEED_CONCURRENCY_TESTS:false}