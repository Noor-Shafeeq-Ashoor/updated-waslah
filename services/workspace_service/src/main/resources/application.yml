# All environment-specific values come from environment variables (see services/.env.example).
server:
  port: ${PORT:8083}

spring:
  application:
    name: workspace-service
  config:
    # Local runs read services/.env (from the service folder, the services folder or the repo root).
    # In Docker and AWS the same names come from real environment variables instead.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:services/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/waslah}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # validate: the service never changes tables; it fails fast if its entities do not match them.
      ddl-auto: ${DDL_AUTO:validate}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Never hold a request for long if Kafka is down: fail fast and log.
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

jwt:
  secret: ${JWT_SECRET}

internal:
  token: ${INTERNAL_TOKEN:}

services:
  identity-url: ${IDENTITY_URL:http://localhost:8081}

app:
  notifications:
    # kafka (default) or log (no broker needed, used by tests)
    publisher: ${NOTIFICATION_PUBLISHER:kafka}
  kafka:
    topics:
      booking-events: booking-events
      session-events: session-events

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.ga.waslah: INFO
