# All environment-specific values come from environment variables (see services/.env.example).
server:
  port: ${PORT:8082}

spring:
  application:
    name: career-service
  config:
    # Local runs read services/.env (from the service folder, the services folder or the repo root).
    # In Docker and AWS the same names come from real environment variables instead.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:services/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/waslah}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # validate: the service never changes tables; it fails fast if its entities do not match them.
      ddl-auto: ${DDL_AUTO:validate}

jwt:
  secret: ${JWT_SECRET}

internal:
  token: ${INTERNAL_TOKEN:}

services:
  identity-url: ${IDENTITY_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.ga.career_service: INFO
